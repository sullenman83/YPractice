services:
  events-app:
    image: eventswebapi:latest
    build:
      context: .                          # Контекст сборки — корень решения
      dockerfile: Events/Events.Presentation/Dockerfile  # Путь к конкретному Dockerfile
    ports:
      - "5001:8080"                       # Доступен на хосте по порту 5001
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - JWT_KEY=мой секретный ключ
      - ConnectionStrings__PostgresConnection=Host=events-db;Port=5432;Database=events;Username=postgres;Password=postgres
    depends_on:
        events-db:
            condition: service_healthy # Ждем, пока СУБД полностью поднимется и начнет принимать соединения

  bookings-app:
    image: bookingswebapi:latest
    build:
      context: .                          # Контекст сборки — корень решения
      dockerfile: Bookings/Bookings.Presentation/Dockerfile
    ports:
      - "5002:8080"                       # Доступен на хосте по порту 5002
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - JWT_KEY=мой секретный ключ
      - ConnectionStrings__PostgresConnection=Host=bookings-db;Port=5432;Database=bookings;Username=postgres;Password=postgres
     
  
    depends_on:
        bookings-db:
            condition: service_healthy # Ждем, пока СУБД полностью поднимется и начнет принимать соединения  
      
          
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: eventapi-kafka    
    ports:
      # Внешний listener для подключения с хоста (например, из dotnet run локально).
      - "9092:9092"
    environment:      
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # Два listener'а: INTERNAL — для сервисов внутри сети Docker, EXTERNAL — для хоста.
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_CLUSTER_ID: '4L62ydgTyQN6usAxgznBNA' 
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:29092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15
 
  # ─────────────────────────── Базы данных (по одной на сервис) ───────────────────────────
  users-db:
    image: postgres:16
    container_name: eventapi-users-db
    environment:
      POSTGRES_DB: users
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - users-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  events-db:
    image: postgres:16
    container_name: eventapi-events-db
    environment:
      POSTGRES_DB: events
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - events-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  bookings-db:
    image: postgres:16
    container_name: eventapi-bookings-db
    environment:
      POSTGRES_DB: bookings
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - bookings-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  users-db-data:
  events-db-data:
  bookings-db-data:
