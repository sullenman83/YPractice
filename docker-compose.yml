services:
  events-app:
    image: eventswebapi:latest
    build:
      context: .                          # Контекст сборки — корень решения
      dockerfile: Events/Events.Presentation/Dockerfile  # Путь к конкретному Dockerfile
    ports:
      - "5001:8080"                       # Доступен на хосте по порту 5001
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - JWT_KEY=мой секретный ключ
      - ConnectionStrings__PostgresConnection=Host=events-db;Port=5432;Database=events;Username=postgres;Password=postgres
    depends_on:
        events-db:
            condition: service_healthy # Ждем, пока СУБД полностью поднимется и начнет принимать соединения

  bookings-app:
    image: bookingswebapi:latest
    build:
      context: .                          # Контекст сборки — корень решения
      dockerfile: Bookings/Bookings.Presentation/Dockerfile
    ports:
      - "5002:8080"                       # Доступен на хосте по порту 5002
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - JWT_KEY=мой секретный ключ
      - ConnectionStrings__PostgresConnection=Host=bookings-db;Port=5432;Database=bookings;Username=postgres;Password=postgres
     
  
    depends_on:
        bookings-db:
            condition: service_healthy # Ждем, пока СУБД полностью поднимется и начнет принимать соединения  
      
  
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
 
  # ─────────────────────────── Базы данных (по одной на сервис) ───────────────────────────
  users-db:
    image: postgres:16
    container_name: eventapi-users-db
    environment:
      POSTGRES_DB: users
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - users-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  events-db:
    image: postgres:16
    container_name: eventapi-events-db
    environment:
      POSTGRES_DB: events
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - events-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  bookings-db:
    image: postgres:16
    container_name: eventapi-bookings-db
    environment:
      POSTGRES_DB: bookings
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - bookings-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  users-db-data:
  events-db-data:
  bookings-db-data:
